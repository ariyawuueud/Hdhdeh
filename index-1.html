<style>
:root{--bg:#0a0e16;--tx:#f2f5fb;--sub:#8c97ab;--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.14);--ac:#3b9cff;--ac2:#7a5cff;--me:linear-gradient(135deg,#3b9cff,#6a5cff);--him:rgba(255,255,255,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1f8;--tx:#101827;--sub:#6b7688;--gl:rgba(255,255,255,.7);--gb:rgba(255,255,255,.9);--him:rgba(255,255,255,.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);user-select:none}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.35}
.bg i:nth-child(1){background:var(--ac);top:-25vmax;right:-20vmax}
.bg i:nth-child(2){background:var(--ac2);bottom:-25vmax;left:-20vmax}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 16px;opacity:0;pointer-events:none;transform:scale(.9);transition:transform .38s cubic-bezier(.2,.9,.25,1),opacity .28s ease;will-change:transform,opacity}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.glass{background:var(--gl);border:1px solid var(--gb);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-radius:26px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}
.center{margin:auto;width:100%;max-width:420px;text-align:center}
.logo{font-size:64px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sub);margin:6px 0 26px}
.role{display:block;width:100%;padding:20px;margin-bottom:12px;font-size:18px;font-weight:700}
.role small{display:block;color:var(--sub);font-weight:400;font-size:13px;margin-top:4px}
.sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet .box{width:100%;max-width:460px;margin:12px;padding:20px;transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.9,.25,1);background:var(--bg)}
.sheet.on .box{transform:none}
input{width:100%;font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--gb);border-radius:16px;padding:14px;outline:0;margin:10px 0;user-select:text;text-align:center}
.pri{width:100%;padding:14px;border-radius:16px;background:var(--me);color:#fff;font-weight:700}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.top{display:flex;align-items:center;gap:12px;direction:ltr;margin-bottom:22px}
.hd{width:170px;height:118px;object-fit:cover;flex:none;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.ttl{direction:rtl;flex:1;text-align:right}
.ttl b{font-size:34px;font-weight:800;display:block;line-height:1}
.ttl span{font-size:13px;color:var(--sub)}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:17px}
.tile .ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:var(--me);box-shadow:0 8px 20px rgba(59,156,255,.35)}
.tile.soon .ic{background:linear-gradient(135deg,#ff9f43,#ff5e7e)}
.tile em{font-style:normal;font-size:12px;color:var(--sub);font-weight:400}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar h2{flex:1;font-size:20px}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 0 70px;-webkit-overflow-scrolling:touch}
.chat{display:flex;align-items:center;gap:12px;padding:12px;text-align:right;width:100%}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none}
.ci{flex:1;min-width:0}.ci b{display:block}.ci span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.meta{text-align:left;font-size:12px;color:var(--sub)}
.bd{background:var(--ac);color:#fff;border-radius:10px;padding:1px 7px;display:inline-block;margin-top:4px}
.fab{position:absolute;bottom:22px;left:20px;width:58px;height:58px;border-radius:50%;background:var(--me);color:#fff;font-size:26px;box-shadow:0 10px 26px rgba(59,156,255,.5)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 2px}
.m{max-width:78%;padding:10px 14px;border-radius:20px;line-height:1.7;font-size:15px;user-select:text;animation:pop .25s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.95)}}
.m.me{align-self:flex-start;background:var(--me);color:#fff;border-bottom-right-radius:6px}
.m.him{align-self:flex-end;background:var(--him);border:1px solid var(--gb);border-bottom-left-radius:6px}
.m time{display:block;font-size:10px;opacity:.65;margin-top:2px}
.inp{display:flex;gap:8px;align-items:center;padding:8px;margin-top:8px}
.inp input{margin:0;text-align:right;border-radius:20px}
.send{width:44px;height:44px;border-radius:50%;background:var(--me);color:#fff;flex:none}
.tag{font-size:11px;background:var(--me);color:#fff;border-radius:8px;padding:2px 8px;margin-right:6px}
.soonbox{margin:auto;text-align:center;padding:40px}
.soonbox div{font-size:60px}
:root{--tgbg:#0e1621;--tgh:#17212b;--line:#0b121a;--bme:#2b5278;--bhim:#182533;--wall:#0b141d;--tgi:#17212b}
:root[data-theme=light]{--tgbg:#fff;--tgh:#3a8dde;--line:#e6ebf0;--bme:#e1ffc7;--bhim:#fff;--wall:#d9e4ee;--tgi:#f1f3f5}
#msgr,#room{background:var(--tgbg);padding:0;opacity:1;transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.9,.25,1)}
#msgr{z-index:2}#room{z-index:3}
#msgr.on,#room.on{transform:none}
#msgr .bar,#room .bar{margin:0;border-radius:0;border:0;background:var(--tgh);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;gap:10px}
#msgr .bar .ibtn,#room .bar .ibtn{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff}
#msgr .bar h2,#room .bar h2{color:#fff}
#q{background:var(--tgi);border:0;border-radius:12px;margin:8px 12px!important;width:calc(100% - 24px);color:var(--tx)}
#list{gap:0;padding:0 0 90px}
#list .chat{background:transparent;border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line);padding:10px 14px}
#list .chat:active{background:var(--tgi);transform:none}
#msgs,.msgs{background:var(--wall);padding:12px}
#room .m{border:0;border-radius:16px;color:var(--tx);backdrop-filter:none}
#room .m.me{background:var(--bme);border-bottom-right-radius:4px}
#room .m.him{background:var(--bhim);border-bottom-left-radius:4px}
#room .inp{background:var(--tgh);border:0;border-radius:0;margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));backdrop-filter:none;-webkit-backdrop-filter:none}
#room .inp input{background:var(--tgbg);border:0;color:var(--tx)}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
[hidden]{display:none!important}
button{touch-action:manipulation}
.list,.msgs{overscroll-behavior:contain}
.chat{content-visibility:auto;contain-intrinsic-size:72px}
.screen.on .tile{animation:rise .5s cubic-bezier(.2,.9,.25,1) both}.screen.on .tile:nth-child(2){animation-delay:.07s}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.94)}}
.sk{height:70px;border-radius:14px;margin:6px 12px;background:linear-gradient(90deg,var(--tgi) 25%,var(--line) 50%,var(--tgi) 75%);background-size:200% 100%;animation:shm 1s infinite linear}
@keyframes shm{to{background-position:-200% 0}}
.pinb{background:var(--tgh);color:#fff;padding:7px 14px;font-size:13px;border-top:1px solid rgba(255,255,255,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rpl{display:flex;justify-content:space-between;align-items:center;background:var(--tgh);color:#fff;padding:6px 14px;font-size:13px}
.rpl button{color:#fff;font-size:16px}
.ro{padding:14px;text-align:center;background:var(--tgh);color:#fff;font-size:14px}
#room .inp .ibtn{font-size:20px;flex:none;color:var(--tx)}
.rec{background:#e33!important;border-radius:50%;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
.m .q{border-right:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;font-size:12px;opacity:.9;background:rgba(127,127,127,.15);border-radius:6px;cursor:pointer}
.nm{display:block;font-size:12px;color:var(--ac);font-weight:700}
.pic{max-width:100%;max-height:300px;border-radius:12px;display:block;margin-bottom:4px}
.rx{font-size:15px;margin-top:2px}
.sos{background:#a1121f!important;color:#fff!important;animation:pl 1.2s 3}
.m audio{max-width:230px;height:38px}
.file{color:inherit;display:block;text-decoration:none}.file small{display:block;opacity:.6}
#msgs[data-w="1"]{background:linear-gradient(160deg,#1d3557,#3b1f5e)}
#msgs[data-w="2"]{background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:22px 22px}
.sheet .box{max-height:80vh;overflow:auto}
.mi{display:block;width:100%;text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);font-size:15px}
.red{color:#ff5a5f}
.emo{display:flex;justify-content:space-around;padding-bottom:8px;font-size:28px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:28px;height:28px;border-radius:50%;margin-right:6px;border:2px solid var(--gb)}
.chip{padding:6px 12px;border-radius:12px;background:var(--tgi);margin-right:6px;font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:14px;z-index:50;animation:pop .25s}
.cmf{padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cmf textarea,.cmf select{font:inherit;color:var(--tx);background:var(--tgi);border:0;border-radius:12px;padding:10px;outline:0}
.cmi{padding:12px}
.an input{width:auto;margin:0 6px;display:inline}
#rs{background:var(--tgh);color:#fff;border:0;border-radius:0;margin:0;padding:10px 14px;text-align:right}
.po{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-top:4px;border-radius:10px;background:rgba(127,127,127,.18);overflow:hidden;cursor:pointer}
.po i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ac);opacity:.35;transition:width .4s}
.po span,.po b{position:relative}
.m code{background:rgba(127,127,127,.25);padding:0 4px;border-radius:4px}
.sheet .pri{margin-top:6px}

.tile.sm{aspect-ratio:1.5;gap:6px;font-size:15px}.tile.sm .ic{width:46px;height:46px;font-size:23px;border-radius:15px;background:linear-gradient(135deg,#34c759,#2ec4b6);box-shadow:none}#tRp .ic{background:linear-gradient(135deg,#a855f7,#ec4899)}
.screen.on .tile:nth-child(3){animation-delay:.14s}.screen.on .tile:nth-child(4){animation-delay:.21s}
.mn{color:var(--ac);font-weight:700}.akb{display:block;margin-top:6px;padding:7px 12px;border-radius:12px;background:var(--ac);color:#fff;font-size:13px;font-weight:700}.akd{margin-top:6px;font-size:12px;opacity:.8}
.mnl{display:flex;gap:6px;padding:6px 10px;overflow-x:auto}.mnl[hidden]{display:none}
.tk{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.tk.dn span{text-decoration:line-through;opacity:.5}.tk.ov span{color:#ff5e7e}.tk small{color:var(--sub)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.stg div{background:var(--tgi);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--sub)}.stg b{display:block;font-size:22px;color:var(--tx)}
.rb{position:relative;display:flex;justify-content:space-between;padding:8px 10px;margin:4px 0;border-radius:10px;background:var(--tgi);overflow:hidden;font-size:13px}.rb i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ac);opacity:.3}.rb span,.rb b{position:relative}
.off{position:fixed;top:0;inset-inline:0;z-index:60;background:#ff9f43;color:#000;text-align:center;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;font-size:13px;font-weight:700}.off[hidden]{display:none}
#ax{width:100%;margin-bottom:8px}
#tMb{grid-column:span 2;aspect-ratio:3.6;flex-direction:row;gap:12px}#tMb[hidden]{display:none}#tMb em{display:none}
.sheet.full{align-items:stretch;background:var(--bg)}.sheet.full .box{margin:0;max-width:none;width:100%;height:100%;max-height:none;border-radius:0;border:0;padding-top:calc(14px + env(safe-area-inset-top,0px))}.pback{margin-bottom:6px;font-size:22px}
.cd{font-size:26px;font-weight:800;letter-spacing:3px;direction:ltr;text-align:center;padding:16px;margin:10px 0;border-radius:16px;background:var(--tgi);user-select:all}.bdg{font-size:11px;padding:2px 8px;border-radius:9px;background:var(--tgi);color:var(--sub)}
</style>
</head>

(()=>{

 if(tc++%5===0){const L=await rpc('chats'),ids=new Set(L.map(x=>x.id));
  L.forEach(x=>{const mem=[],mid=[];x.mem.forEach((n,i)=>{if(x.mid[i]!==ses.id){mem.push(n);mid.push(x.mid[i])}});let c=C.find(c=>c.id===x.id);if(!c){c=mkc(x.n,x.t,mem);c.id=x.id;c.sy=1;C.unshift(c)}else{c.n=x.n;c.mem=mem}c.mid=mid});
  C=C.filter(c=>!(c.sy&&c.id&&kd(c))||ids.has(c.id));ch=1}
 for(const c of C)if(!c.sy&&kd(c)&&ses.r==='cmd'){await rpc('make_chat',{id:c.id,n:c.n,t:c.t});c.sy=1;tc=0}
 for(const c of C)if(srv(c))for(const m of c.m)if(m.sy===0&&!m.q){const b={k:m.k,x:m.x,r:m.r,fw:m.fw,o:m.o&&m.o.map(z=>({t:z.t})),ex:m.ex,sl:m.sl,fn:m.fn,sz:m.sz,d:m.d};
  if(JSON.stringify(b).length>18000){m.sy=-1;toast('فایل بزرگ بعد از اتصال Storage ارسال می‌شود');if(C[cur]===c)rep(m);continue}
  try{await rpc('send',{id:String(m.i),chat:c.id,body:b});m.sy=1;m.st=2;ch=1}catch(e){if(isPerm(e)){m.sy=-2;toast('ارسال نشد: '+e.message)}else throw e}
  if(C[cur]===c)rep(m)}
 for(const c of C)if(srv(c)&&c.ox&&c.ox.length){const keep=[];
  for(let j=0;j<c.ox.length;j++){const ev=c.ox[j],m=c.m.find(x=>String(x.i)===ev.m);if(!m||m.sy<0)continue;if(m.sy===0){keep.push(ev);continue}
   try{await rpc('emit',{eid:ev.id,cid:c.id,mid:ev.m,kd:ev.k,dt:ev.d})}catch(e){if(!isPerm(e)){c.ox=keep.concat(c.ox.slice(j));throw e}}}
  c.ox=keep;ch=1}
 const R=await rpc('pull_all',{after:LAST});let miss=0,mx=LAST;
 for(const x of R){const c=C.find(c=>c.id===x.c);if(!c){miss=1;continue}mx=Math.max(mx,x.t);
  if(c.m.some(m=>String(m.i)===x.id))continue;
  const b=cleanBody(x.b);if(b.ex&&b.ex<now())continue;
  const m=Object.assign({},b,{i:x.id,w:x.s===ses.id?'me':'him',nm:x.n,tm:hmt(x.t),st:3});
  c.m.push(m);ch=1;
  if(cur!==null&&C[cur]===c&&$('#room').classList.contains('on')){draw(m,1);scr()}
  else if(m.w==='him'){c.un=(c.un||0)+1;if(!c.mu&&!m.sl){tone();vb(m.k==='s'?[60,40,60]:10)}}}
 if(miss)tc=0;else if(mx!==LAST){LAST=mx;lsv2()}
 const E=await rpc('pull_events',{after:LASTE});let me2=LASTE;
 for(const e of E){me2=Math.max(me2,e.t);if(EVS.has(e.id))continue;EVS.add(e.id);const c=C.find(c=>c.id===e.c);if(c){applyEv(c,e);ch=1}}
 if(EVS.size>3000)EVS.clear();if(me2!==LASTE){LASTE=me2;lsv2()}
 if(cc){const k=C.indexOf(cc);if(k<0){cur=null;close('room')}else cur=k}
 if(ch){sv();if($('#msgr').classList.contains('on'))renderList()}}
async function tick(){if(CFG.url&&ready&&ses&&role){try{await syncAll();sok=1;fl=0}catch(e){sok=0;fl++}bn()}setTimeout(tick,Math.min(3e3*2**Math.min(fl,4),3e4))}tick();
if(!S.ph)boot();
})();
</script>
