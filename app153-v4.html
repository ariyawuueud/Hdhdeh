#msgs[data-w="0"]{background:radial-gradient(60% 38% at 12% 8%,rgba(59,156,255,.30),transparent),radial-gradient(55% 40% at 92% 88%,rgba(122,92,255,.28),transparent),radial-gradient(40% 30% at 85% 30%,rgba(255,94,126,.12),transparent),linear-gradient(180deg,#0b1220,#070b14)}
#msgs[data-w="2"]{background-color:#0b1220;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.5px)}
#room .m{color:#fff;border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);box-shadow:0 2px 10px rgba(0,0,0,.25)}
#room .m.me{background:rgba(59,156,255,.5);background:color-mix(in srgb,var(--ac) 55%,transparent)}
#room .m.him{background:rgba(255,255,255,.12)}
#room .m.tl::after{width:7px;height:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#room .m.me.tl::after{right:-7px;background:rgba(59,156,255,.5);background:color-mix(in srgb,var(--ac) 55%,transparent)}
#room .m.him.tl::after{left:-7px;background:rgba(255,255,255,.12)}
#room .m .q{background:rgba(0,0,0,.22)}
.ds{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#list .chat{gap:12px;padding:10px 14px}
#list .chat .av{width:54px;height:54px;font-size:22px}
#list .ci b{font-size:16px}
#list .ci span{font-size:14px;margin-top:2px}
.lp{color:var(--ac);font-style:normal}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:44px}
.meta .tk2{color:var(--ac)}
.bd.mu{background:#7d8798;box-shadow:none}
.gh{text-align:center;padding:4px 0 12px}
.gav{width:86px;height:86px;font-size:36px;margin:0 auto 10px}
.gh h3{font-size:20px}
.gh .sub{margin:2px 0 0}
.stg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stg3 div{background:var(--tgi);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--sub)}
.stg3 b{display:block;font-size:18px;color:var(--tx)}
.mi2{display:flex;align-items:center;gap:10px}
.mav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-style:normal;flex:none}
.mi2 small{color:var(--sub)}
.adm{color:var(--ac);font-size:12px}

/* ===== v10: گلس واقعی + انیمیشن روان ===== */
:root{--spring:cubic-bezier(.34,1.45,.55,1);--smooth:cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes springIn{0%{opacity:0;transform:translateY(20px) scale(.82)}55%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,24px) scale(.88)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes wp{0%{background-position:0% 0%,100% 100%,85% 15%,10% 90%,0 0}100%{background-position:35% 45%,65% 55%,40% 65%,60% 30%,0 0}}
@keyframes bob{50%{translate:0 -4px}}
@keyframes ring{0%{box-shadow:0 10px 26px rgba(59,156,255,.5),0 0 0 0 rgba(59,156,255,.45)}100%{box-shadow:0 10px 26px rgba(59,156,255,.5),0 0 0 18px rgba(59,156,255,0)}}
#msgs[data-w="0"]{background:radial-gradient(45% 35% at 20% 20%,rgba(59,156,255,.5),transparent 70%),radial-gradient(45% 38% at 80% 80%,rgba(122,92,255,.45),transparent 70%),radial-gradient(35% 28% at 80% 20%,rgba(255,94,126,.30),transparent 70%),radial-gradient(35% 28% at 15% 85%,rgba(46,196,182,.28),transparent 70%),linear-gradient(180deg,#0a1020,#060912);background-size:150% 150%,150% 150%,150% 150%,150% 150%,100% 100%;background-repeat:no-repeat;animation:wp 22s ease-in-out infinite alternate}
#room .m{animation:none;border:1px solid rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.38);border-left-color:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.12);backdrop-filter:blur(18px) saturate(1.9) brightness(1.12);text-shadow:0 1px 2px rgba(0,0,0,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.34)}
#room .m.nw{animation:springIn .55s cubic-bezier(.2,.85,.3,1) both}
#room .m.me{transform-origin:100% 100%;background:linear-gradient(135deg,rgba(59,156,255,.62),rgba(122,92,255,.45));background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 66%,transparent),color-mix(in srgb,var(--ac2) 46%,transparent))}
#room .m.him{transform-origin:0 100%;background:linear-gradient(135deg,rgba(255,255,255,.24),rgba(255,255,255,.07))}
#room .m::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.05) 38%,transparent 60%);opacity:.8}
#room .m.tl::after{background-image:none}
#room .m.me.tl::after{background:rgba(110,130,255,.5);background:color-mix(in srgb,var(--ac2) 50%,transparent);border:0}
#room .m.him.tl::after{background:rgba(255,255,255,.14)}
.ds{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadeUp .5s var(--smooth) both}
#room .inp{background:rgba(14,21,34,.72)!important;border-top:1px solid rgba(255,255,255,.1)!important;-webkit-backdrop-filter:blur(22px) saturate(1.6)!important;backdrop-filter:blur(22px) saturate(1.6)!important}
#room .inp input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:22px;transition:background .25s,border-color .25s,box-shadow .25s}
#room .inp input:focus{background:rgba(255,255,255,.16);border-color:var(--ac)}
#room .inp input::placeholder{color:rgba(255,255,255,.5)}
#room .inp .ibtn{color:#fff}
.send{box-shadow:0 6px 18px rgba(59,156,255,.45);transition:transform .25s var(--spring),box-shadow .25s}
.send:active{transform:scale(.82) rotate(-14deg)}
button{transition:transform .28s var(--spring),background .2s,opacity .2s}
button:active{transform:scale(.9)}
.screen{transition:transform .55s var(--smooth),opacity .38s ease}
#msgr,#room,#cm{transition:transform .5s var(--smooth)}
.sheet{transition:opacity .3s ease}
.sheet:not(.full) .box{transition:transform .55s cubic-bezier(.22,1.25,.36,1),opacity .3s;opacity:0}
.sheet:not(.full):not(.on) .box{transform:translateY(70px) scale(.94)}
.sheet.on:not(.full) .box{opacity:1}
.sheet:not(.full) .box{background:rgba(16,24,38,.78);background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7)}
.toast{animation:toastIn .5s var(--spring) both}
.tile .ic{animation:bob 4.5s ease-in-out infinite}
.tile:nth-child(2) .ic{animation-delay:-1s}.tile:nth-child(3) .ic{animation-delay:-2s}.tile:nth-child(4) .ic{animation-delay:-3s}.tile:nth-child(5) .ic{animation-delay:-1.5s}
.tile:active{transform:scale(.94)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s var(--smooth);pointer-events:none}
.tile:hover::after,.tile:active::after{transform:translateX(120%)}
.fab{animation:fabIn .7s var(--spring) both,ring 2.8s ease-out 1s infinite}
@keyframes fabIn{from{opacity:0;transform:scale(.3) rotate(-90deg)}to{opacity:1;transform:none}}
#list.ent .chat{animation:fadeUp .6s var(--smooth) both}
#list.ent .chat:nth-child(1){animation-delay:0ms}#list.ent .chat:nth-child(2){animation-delay:45ms}#list.ent .chat:nth-child(3){animation-delay:90ms}#list.ent .chat:nth-child(4){animation-delay:135ms}#list.ent .chat:nth-child(5){animation-delay:180ms}#list.ent .chat:nth-child(6){animation-delay:225ms}#list.ent .chat:nth-child(7){animation-delay:270ms}#list.ent .chat:nth-child(8){animation-delay:315ms}#list.ent .chat:nth-child(9){animation-delay:360ms}#list.ent .chat:nth-child(10){animation-delay:405ms}
#list .chat{transition:transform .25s var(--spring),background .2s}
.mrow,.tk,.row{animation:fadeUp .4s var(--smooth) both}
.av{transition:transform .3s var(--spring)}.chat:active .av{transform:scale(.92)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let role='',cur=null;
const col=i=>['#3b9cff','#7a5cff','#ff5e7e','#ff9f43','#2ec4b6','#8e6cff'][i%6];
let chats=[
 {n:'فرمانده حوزه',t:'کانال',m:[['him','به همه نیروها: ساعت ۸ آماده‌باش.']]},
 {n:'گروه عملیات',t:'گروه',m:[['him','گزارش وضعیت ارسال شد.']]},
 {n:'پشتیبانی',t:'پیام',m:[['him','سلام! چطور کمک کنم؟']]}
];
try{const s=JSON.parse(localStorage.getItem('c153'));if(s)chats=s}catch(e){}
const save=()=>{try{localStorage.setItem('c153',JSON.stringify(chats))}catch(e){}};
const hm=()=>new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
$('#date').textContent=new Intl.DateTimeFormat('fa-IR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());

function open(id,el){const s=$('#'+id);if(el){const r=el.getBoundingClientRect();s.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2}px`}else s.style.transformOrigin='50% 50%';requestAnimationFrame(()=>s.classList.add('on'))}
function close(id){$('#'+id).classList.remove('on')}
$$('[data-back]').forEach(b=>b.onclick=()=>close(b.dataset.back));

function enter(r){role=r;$('#roleLbl').textContent=r==='cmd'?'حوزه':'نیروی عادی';$('#rtag').textContent=$('#roleLbl').textContent;$('#fab').hidden=r!=='cmd';close('entry');open('home')}

$('#tMsg').onclick=e=>{renderList();open('msgr',e.currentTarget)};
$('#tCm').onclick=e=>open('cm',e.currentTarget);

function renderList(){
 const q=$('#q').value.trim(),l=$('#list');l.innerHTML='';
 chats.forEach((c,i)=>{if(q&&!c.n.includes(q))return;
  const last=c.m[c.m.length-1]||['', 'بدون پیام'];
  const b=document.createElement('button');b.className='glass chat';
  b.innerHTML=`<div class="av" style="background:${col(i)}">${E(c.n[0])}</div><div class="ci"><b>${E(c.n)} <small style="color:var(--sub);font-weight:400">${c.t==='پیام'?'':E(c.t)}</small></b><span>${E(last[1])}</span></div><div class="meta">${E(last[2]||'')}</div>`;
  b.onclick=()=>openRoom(i,b);l.appendChild(b)});
}
$('#q').oninput=renderList;

function bubble(m){const d=document.createElement('div');d.className='m '+m[0];d.innerHTML=`${m[1].replace(/</g,'&lt;')}<time>${m[2]||''}</time>`;$('#msgs').appendChild(d)}
function openRoom(i,el){cur=i;const c=chats[i];$('#rname').textContent=c.n;const a=$('#rav');a.textContent=c.n[0];a.style.background=col(i);$('#msgs').innerHTML='';c.m.forEach(bubble);open('room',el);setTimeout(()=>$('#msgs').scrollTop=1e6,50)}
function send(){const v=$('#txt').value.trim();if(!v||cur===null)return;const m=['me',v,hm()];chats[cur].m.push(m);bubble(m);$('#txt').value='';$('#msgs').scrollTop=1e6;save();
 const k=cur,reps=['دریافت شد ✅','متوجه شدم، پیگیری می‌کنم.','ممنون از اطلاع‌رسانی.'];
 setTimeout(()=>{const r=['him',reps[Math.random()*3|0],hm()];chats[k].m.push(r);if(cur===k){bubble(r);$('#msgs').scrollTop=1e6}save()},900)}
$('#send').onclick=send;$('#txt').onkeydown=e=>{if(e.key==='Enter')send()};
$('#room').addEventListener('transitionend',e=>{if(e.target.id==='room'&&!$('#room').classList.contains('on')){renderList()}});

$('#fab').onclick=()=>$('#mk').classList.add('on');
$('#mk').onclick=e=>{if(e.target.id==='mk')$('#mk').classList.remove('on')};
$$('[data-mk]').forEach(b=>b.onclick=()=>{const n=$('#mkn').value.trim();if(!n)return;chats.unshift({n,t:b.dataset.mk,m:[['him','«'+n+'» ساخته شد.',hm()]]});save();$('#mkn').value='';$('#mk').classList.remove('on');renderList()});

$('#theme').onclick=e=>{const x=e.clientX||innerWidth/2,y=e.clientY||40,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 const root=document.documentElement,sw=()=>root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
 if(!document.startViewTransition){sw();return}
 document.startViewTransition(sw).ready.then(()=>root.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:550,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'}))};
</script>
<div id="upd" hidden><span>🔄 نسخه‌ی جدید آماده است</span><button id="updb">به‌روزرسانی</button></div><div id="tkp"></div><div class="sheet" id="gs" style="z-index:12"><div class="box glass" id="gb"></div></div>

<script>
(()=>{
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const S=Object.assign({snd:1,vib:1,acc:0,wall:0,al:0,ph:'',cp:'',nm:''},ld('s153',{}));delete S.pin;
const svS=()=>{try{localStorage.setItem('s153',JSON.stringify(S))}catch(e){}};
const te=new TextEncoder(),td=new TextDecoder();
const b64=b=>{let s='';const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let salt=localStorage.getItem('sl153');if(!salt){salt=b64(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem('sl153',salt)}catch(e){}}
let KEY=null;
const hs=async s=>b64(await crypto.subtle.digest('SHA-256',te.encode(s+'|'+salt)));
const hv=async s=>{const k=await crypto.subtle.importKey('raw',te.encode(s),'PBKDF2',false,['deriveBits']);return 'v2:'+b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode(salt+'|verify'),iterations:150000,hash:'SHA-256'},k,256))};
const chk=async v=>S.ph.startsWith('v2:')?(await hv(v))===S.ph:(await hs(v))===S.ph;
const dkey=async pw=>{const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(salt),iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const seal=async o=>{const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,te.encode(JSON.stringify(o)));return b64(iv)+'.'+b64(c)};
const unseal=async s=>{const [i,c]=s.split('.');return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},KEY,ub(c))))};
const devKey=async()=>{let d=localStorage.getItem('dk153');if(!d){d=b64(crypto.getRandomValues(new Uint8Array(32)));localStorage.setItem('dk153',d)}return crypto.subtle.importKey('raw',ub(d),'AES-GCM',false,['encrypt','decrypt'])};
const AC=[['#3b9cff','#7a5cff'],['#2ec4b6','#3b9cff'],['#ff5e7e','#ff9f43'],['#34c759','#2ec4b6'],['#a855f7','#ec4899']];
const DU=/^data:[a-z]+\/[\w.+-]+(;[\w.=+-]+)*;base64,/i;
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--ac)">$1</a>');
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)};
const vb=n=>{if(S.vib)try{navigator.vibrate(n)}catch(e){}};
const tone=()=>{if(!S.snd)return;try{const a=tone.a||(tone.a=new AudioContext()),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.12);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}};
const uid=()=>([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const M=['علی','رضا','مریم','سارا','حسین'];
const mkc=(n,t,mem)=>({id:uid(),n,t,mem,m:[],pin:0,adm:[],inv:Math.random().toString(36).slice(2,8)});
const cleanBody=b=>{b=b&&typeof b==='object'?b:{};const k=['t','i','f','v','p','a','s'].includes(b.k)?b.k:'t',o={k,x:String(b.x==null?'':b.x).slice(0,4000)};
 if(b.r)o.r=String(b.r).slice(0,64);if(b.fw)o.fw=String(b.fw).slice(0,60);if(typeof b.ex==='number'&&isFinite(b.ex))o.ex=b.ex;if(b.sl)o.sl=1;
 if(k==='f'){o.fn=String(b.fn||'file').slice(0,120);o.sz=String(b.sz||'').slice(0,20)}
 if((k==='i'||k==='v'||k==='f')&&typeof b.d==='string'&&b.d.length<20000&&DU.test(b.d)&&/^[A-Za-z0-9+\/=]*$/.test(b.d.slice(b.d.indexOf(',')+1)))o.d=b.d;
 if(k==='p'){o.o=(Array.isArray(b.o)?b.o:[]).slice(0,6).map(z=>({t:String(z&&z.t!=null?z.t:'').slice(0,100),v:[]}));if(o.o.length<2){o.k='t';delete o.o}}
 if(b.del){o.del=1;o.x='';o.d=''}if(b.e)o.e=1;return o};
let C=[],CM=[],T=[],U=[],ready=false;
const defs=()=>{const c=[mkc('پیام‌های ذخیره‌شده','ذخیره',[]),mkc('فرمانده حوزه','کانال',M.slice()),mkc('گروه عملیات','گروه',M.slice()),mkc('پشتیبانی','پیام',[])];[[1,'به همه نیروها: ساعت ۸ آماده‌باش.',''],[2,'گزارش وضعیت ارسال شد.','رضا'],[3,'سلام! چطور کمک کنم؟','']].forEach(([i,x,nm])=>c[i].m.push({i,w:'him',k:'t',x,tm:hm(),nm}));return c};
let st;const save=async()=>{if(!KEY)return;try{localStorage.setItem('v153',await seal({C,CM,T,U}));localStorage.removeItem('c153b');localStorage.removeItem('cm153')}catch(e){}},sv=()=>{clearTimeout(st);st=setTimeout(save,250)};
async function boot(pw){try{KEY=S.ph?await dkey(pw):await devKey();const v=localStorage.getItem('v153');let d=null;if(v)d=await unseal(v);
 if(d){C=d.C;CM=d.CM;T=d.T||[];U=d.U||[]}else{const o=ld('c153b',null);if(o){C=o;CM=ld('cm153',[])}else{C=defs();CM=[]}}
 ready=true;C.forEach(c=>{if(c.n==='حوزه')c.n='فرمانده حوزه'});await save();return true}catch(e){KEY=null;return false}}
const canSend=c=>!(c.t==='کانال'&&role!=='cmd');
const fm=id=>C[cur].m.find(x=>String(x.i)===String(id));
const pt=r=>r.del?'پیام حذف شد':r.k==='i'?'🖼 عکس':r.k==='f'?'📎 '+r.fn:r.k==='v'?'🎤 پیام صوتی':r.k==='p'?'📊 '+r.x:(r.k==='s'?'🚨 ':'')+r.x;
const sub=c=>c.t==='پیام'||c.t==='ذخیره'?'آنلاین':fa(c.mem.length+1)+' عضو';
let rp=null,ed=null;
const gs=h=>{$('#gb').innerHTML=h;$('#gb').onclick=null;$('#gs').classList.add('on')},gx=()=>$('#gs').classList.remove('on');
$('#gs').onclick=e=>{if(e.target.id==='gs')gx()};
const scr=()=>{const e=$('#msgs');e.scrollTo({top:e.scrollHeight,behavior:'smooth'})};

window.renderList=function(){const q=$('#q').value.trim(),l=$('#list');l.innerHTML='';
 C.map((c,i)=>[c,i]).filter(([c])=>!q||c.n.includes(q)).sort((a,b)=>(b[0].pn?1:0)-(a[0].pn?1:0)).forEach(([c,i])=>{const m=c.m[c.m.length-1],b=document.createElement('button');b.className='glass chat';
  const pf=m&&!m.del&&m.k!=='a'?(m.w==='me'?(c.t==='کانال'?'':'شما: '):(c.t==='گروه'&&m.nm?m.nm+': ':'')):'';
  b.innerHTML=`<div class="av" style="background:linear-gradient(135deg,${col(i)},${col(i+1)})">${c.t==='ذخیره'?'🔖':esc(c.n[0])}</div><div class="ci"><b>${c.pn?'📌 ':''}${c.t==='گروه'?'👥 ':c.t==='کانال'?'📢 ':''}${esc(c.n)}${c.mu?' 🔕':''}</b><span>${c.dr?'<em style="color:#ff5a5f;font-style:normal">پیش‌نویس: </em>'+esc(c.dr):m?(pf?'<em class="lp">'+esc(pf)+'</em>':'')+esc(pt(m)):'بدون پیام'}</span></div><div class="meta"><span>${m&&m.w==='me'&&c.t!=='کانال'?'<span class="tk2">'+(m.st>=3?'✓✓':'✓')+'</span> ':''}${m?m.tm:''}</span>${c.un?'<span class="bd'+(c.mu?' mu':'')+'">'+fa(c.un)+'</span>':''}</div>`;
  let t,lp=0;b.addEventListener('pointerdown',()=>{lp=0;t=setTimeout(()=>{lp=1;cmenu(i)},500)},{passive:true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t),{passive:true}));
  b.onclick=()=>{if(!lp)openRoom(i,b)};b.addEventListener('contextmenu',e=>{e.preventDefault();cmenu(i)});l.appendChild(b)})};
function cmenu(i){const c=C[i];vb(15);gs(`<h3 style="margin-bottom:6px">${esc(c.n)}</h3><button class="mi" data-a="pn">📌 ${c.pn?'برداشتن سنجاق':'سنجاق گفتگو'}</button><button class="mi" data-a="mu">${c.mu?'🔔 فعال‌کردن اعلان':'🔕 بی‌صدا'}</button><button class="mi" data-a="rd">✅ خوانده‌شده</button><button class="mi red" data-a="dl">🗑 حذف گفتگو</button>`);
 $('#gb').onclick=e=>{const a=e.target.closest('button')?.dataset.a;if(!a)return;if(a==='pn')c.pn=!c.pn;else if(a==='mu')c.mu=!c.mu;else if(a==='rd')c.un=0;else if(a==='dl')C.splice(i,1);gx();sv();renderList()}}
$('#q').oninput=()=>renderList();
$('#tMsg').onclick=e=>{$('#list').innerHTML='<div class="sk"></div>'.repeat(6);open('msgr',e.currentTarget);setTimeout(renderList,300)};

function mkEl(m,nw){if(m.d&&!DU.test(m.d))m.d='';const c=C[cur],d=document.createElement('div');d.className='m '+m.w+(m.k==='s'?' sos':'')+(nw?' nw':'');d.dataset.i=m.i;let h='';
 if(m.nm&&m.w==='him')h+=`<b class="nm" style="color:${nc(m.nm)}">${esc(m.nm)}</b>`;
 if(m.fw)h+=`<div class="q">↪ فوروارد از ${esc(m.fw)}</div>`;
 if(m.r){const r=fm(m.r);if(r)h+=`<div class="q" data-go="${r.i}">${esc(r.w==='me'?'شما':r.nm||c.n)}: ${esc(pt(r))}</div>`}
 if(m.del)h+='<i style="opacity:.6">🚫 این پیام حذف شد</i>';
 else if(m.k==='i')h+=`<img class="pic" src="${esc(m.d)}">`+esc(m.x);
 else if(m.k==='f')h+=`<a class="file" ${m.d?`href="${esc(m.d)}" download="${esc(m.fn)}"`:''}>📎 ${esc(m.fn)}<small>${esc(m.sz)}</small></a>`;
 else if(m.k==='v')h+=`<audio controls src="${esc(m.d)}"></audio>`;
 else if(m.k==='p'){const tot=m.o.reduce((a,x)=>a+x.v.length,0)||1;h+=`<b>📊 ${esc(m.x)}</b>`+m.o.map((o,j)=>{const pc=Math.round(o.v.length/tot*100);return `<div class="po" data-p="${m.i}" data-o="${j}"><i style="width:${pc}%"></i><span>${o.v.includes('شما')?'✅ ':''}${esc(o.t)}</span><b>${fa(pc)}٪</b></div>`}).join('')}
 else if(m.k==='a')h+=anH(m);else h+=(m.k==='s'?'🚨 ':'')+mn(fmt(m.x));
 if(m.rx&&m.rx.length)h+=`<div class="rx">${m.rx.join('')}</div>`;
 h+=`<time>${m.sl?'🔕 ':''}${m.sc?'⏰ ':''}${m.sy<0?'⚠️ ':''}${m.q||m.sy===0?'🕓 ':''}${m.e?'ویرایش‌شده · ':''}${m.tm}${m.w==='me'?' '+['','✓','✓✓','<span style="color:#7fd0ff">✓✓</span>'][m.st||1]:''}${m.sn&&role==='cmd'&&m.w==='me'?` <span data-seen="${m.i}">👁 ${fa(m.sn.length)}</span>`:''}</time>`;
 d.innerHTML=h;return d}
const draw=(m,nw)=>$('#msgs').appendChild(mkEl(m,nw));
const rep=m=>{const el=$('#msgs [data-i="'+m.i+'"]');if(el)el.replaceWith(mkEl(m));pinUI()};
function pinUI(){const c=C[cur],b=$('#pinb'),m=c&&c.pin&&fm(c.pin);b.hidden=!m||m.del;if(m)b.textContent='📌 '+pt(m)}
$('#pinb').onclick=()=>{const el=$('#msgs [data-i="'+C[cur].pin+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})};
function rpUI(){const b=$('#rpl');if(rp&&fm(rp)){b.hidden=0;b.innerHTML='<span>↩️ '+esc(pt(fm(rp)))+'</span><button>✕</button>'}else if(ed){b.hidden=0;b.innerHTML='<span>✏️ ویرایش پیام</span><button>✕</button>'}else{b.hidden=1;return}
 b.querySelector('button').onclick=()=>{rp=ed=null;$('#txt').value='';rpUI()}}

window.openRoom=function(i,el){cur=i;const c=C[i];c.un=0;$('#rname').textContent=c.n;const a=$('#rav');a.textContent=c.t==='ذخیره'?'🔖':c.n[0];a.style.background=col(i);$('#rsub').textContent=sub(c);
 $('#sosb').hidden=!(role==='cmd'&&(c.t==='گروه'||c.t==='کانال'));$('#info').hidden=c.t==='ذخیره';
 const ok=canSend(c);$('#room .inp').style.display=ok?'':'none';$('#ro').hidden=ok;
 rp=ed=null;rpUI();$('#txt').value=c.dr||'';$('#rs').hidden=true;$('#rs').value='';const ms=$('#msgs');ms.innerHTML='';renderMsgs(c);pinUI();open('room',el);setTimeout(()=>ms.scrollTop=ms.scrollHeight,40)};

const rps=['دریافت شد ✅','متوجه شدم، پیگیری می‌کنم.','ممنون از اطلاع‌رسانی.','در حال انجام است.'];
function push(m){const c=C[cur],k=cur;m.i=uid();m.tm=hm();m.ts=Date.now();m.w='me';m.st=1;if(rp){m.r=rp;rp=null;rpUI()}
 if(c.ds)m.ex=Date.now()+c.ds*1000;c.dr='';if(CFG.url&&c.id&&kd(c))m.sy=0;c.m.push(m);draw(m,1);scr();sv();tone();vb(8);
 setTimeout(()=>{if(m.sy===0)return;m.st=2;rep(m)},500);
 if(c.t==='ذخیره'||CFG.url)return;
 setTimeout(()=>{if(cur===k&&c.t!=='کانال')$('#rsub').textContent='در حال نوشتن…'},800);
 setTimeout(()=>{m.st=3;if(c.mem.length)m.sn=c.mem.filter(()=>Math.random()>.35);if(cur===k){rep(m);$('#rsub').textContent=sub(c)}
  if(c.t==='کانال'){sv();return}
  const r={i:uid(),w:'him',k:'t',x:rps[Math.random()*4|0],tm:hm(),nm:c.mem.length?c.mem[Math.random()*c.mem.length|0]:''};if(c.ds)r.ex=Date.now()+c.ds*1000;c.m.push(r);
  if(cur===k){draw(r,1);scr()}else c.un=(c.un||0)+1;if(!c.mu){tone();vb(m.k==='s'?[60,40,60]:10)}sv()},2000)}

  const msg=`«۱۵۳» کد معرف شما: ${c}\nنام: ${n}\nاعتبار: ${fa(h)} ساعت و فقط یک‌بار قابل‌استفاده`;
  gs(`<h3>کد معرف ${esc(n)}</h3><div class="cd">${c}</div><p class="sub">⚠️ این کد فقط همین حالا دیده می‌شود. آن را برای ${esc(n)} بفرست؛ بعد از اولین ورود باطل می‌شود.</p><button class="pri" id="cc">📋 کپی پیام</button><button class="pri" id="cs2" style="margin-top:8px">📤 ارسال</button>`);fullp();
  $('#cc').onclick=()=>{try{navigator.clipboard.writeText(msg)}catch(e){}toast('کپی شد')};$('#cs2').onclick=()=>{try{navigator.share({text:msg})}catch(e){toast('اشتراک‌گذاری پشتیبانی نمی‌شود')}};
  $('#gb').onclick=null};
 $('#gb').onclick=e=>{const q=e.target.closest('[data-ri]');if(q){rpc('reissue',{mid:q.dataset.ri,h:72}).then(c=>{gs('<h3>کد جدید</h3><div class="cd">'+esc(c)+'</div><p class="sub">برای ورود دستگاه جدید؛ بعد از اولین ورود دائمی می‌شود.</p>')}).catch(()=>toast('انجام نشد'));return}const b=e.target.closest('[data-rv]');if(!b)return;Promise.resolve(API.revoke(b.dataset.rv)).then(members)}}
$('#tMb').onclick=members;

 if(st>0)ms.insertAdjacentHTML('beforeend','<button class="chip" id="old" style="align-self:center;flex:none">⬆️ پیام‌های قدیمی‌تر ('+fa(st)+')</button>');
 const f=document.createDocumentFragment();c.m.slice(st).forEach(m=>f.appendChild(mkEl(m)));ms.appendChild(f)}
$('#msgs').addEventListener('click',e=>{if(e.target.id!=='old')return;const ms=$('#msgs'),h=ms.scrollHeight;shown+=40;renderMsgs(C[cur]);ms.scrollTop=ms.scrollHeight-h});
/* ===== لایه‌ی سرور (فقط وقتی CFG.url پر باشد فعال است) ===== */
const hmt=t=>new Date(t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),kd=c=>c.t==='گروه'||c.t==='کانال'||c.t==='خصوصی';
let sok=1,fl=0,tc=0;
function bn(){off.hidden=navigator.onLine&&sok;off.textContent=navigator.onLine?'🔌 اتصال به سرور برقرار نیست؛ دوباره تلاش می‌کنم…':'📡 آفلاین — پیام‌ها در صف می‌مانند'}
async function rpc(fn,body,anon){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
 try{const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',signal:ctl.signal,headers:Object.assign({'Content-Type':'application/json',apikey:CFG.key},CFG.key.startsWith('eyJ')?{Authorization:'Bearer '+CFG.key}:{}),body:JSON.stringify(anon?body:Object.assign({tk:localStorage.getItem('tk153')||''},body))});
  const j=await r.json().catch(()=>null);if(!r.ok){const m=(j&&j.message)||String(r.status);if(m==='unauthorized'){try{localStorage.removeItem('ss153');localStorage.removeItem('tk153')}catch(e){}location.reload()}throw new Error(m)}return j}finally{clearTimeout(t)}}
const srv=c=>CFG.url&&c.id&&kd(c);
const isPerm=e=>/^(forbidden|no_chat|no_msg|bad_input|too_big|unauthorized)$/.test(e&&e.message);
let LAST=+ld('lp153',0)||0,LASTE=+ld('le153',0)||0;const EVS=new Set();
const lsv2=()=>{try{localStorage.setItem('lp153',LAST);localStorage.setItem('le153',LASTE)}catch(e){}};
function emit(c,m,kind,dt){(c.ox=c.ox||[]).push({id:uid(),m:String(m.i),k:kind,d:dt||{}});sv()}
function applyEv(c,e){const m=c.m.find(x=>String(x.i)===e.m);if(!m)return;const mine=e.a===ses.id,nm=mine?'شما':e.n,d=e.d||{};
 if(e.k==='ack'){m.ak=m.ak||[];if(!m.ak.includes(nm))m.ak.push(nm)}
 else if(e.k==='vote'&&m.o&&m.o[d.o|0]){m.o.forEach(x=>{x.v=x.v.filter(n=>n!==nm)});m.o[d.o|0].v.push(nm)}
 else if(e.k==='edit'&&typeof d.x==='string'&&!m.del){m.x=d.x.slice(0,4000);m.e=1}
 else if(e.k==='del'){m.del=1;m.x='';m.d=''}
 else if(e.k==='rx'){m.rxu=m.rxu||{};if(typeof d.e==='string'&&d.e)m.rxu[nm]=d.e.slice(0,8);else delete m.rxu[nm];m.rx=Object.values(m.rxu)}
 else if(e.k==='pin'){if(d.on===false||d.on==='false'){if(c.pin===m.i)c.pin=0}else c.pin=m.i}
 if(C[cur]===c&&$('#room').classList.contains('on'))rep(m)}
async function memOp(c,a,i){try{if(a==='rm')await rpc('chat_rm',{cid:c.id,mid:c.mid[i]});else{const v=$('#nm').value.trim(),L=await rpc('list_members'),f=L.filter(u=>!u.rv&&u.n===v);if(f.length!==1){toast(f.length?'چند نفر با این نام هستند':'عضوی با این نام نیست');return}await rpc('chat_add',{cid:c.id,mid:f[0].id})}tc=0;await syncAll();$('#rsub').textContent=sub(c);$('#info').click()}catch(e){toast('انجام نشد: '+(e&&e.message))}}
async function syncAll(){let ch=0;const cc=cur!==null?C[cur]:null;
 if(tc++%5===0){const L=await rpc('chats'),ids=new Set(L.map(x=>x.id));
  L.forEach(x=>{const mem=[],mid=[];x.mem.forEach((n,i)=>{if(x.mid[i]!==ses.id){mem.push(n);mid.push(x.mid[i])}});let c=C.find(c=>c.id===x.id);if(!c){c=mkc(x.t==='خصوصی'?(mem[0]||'کاربر'):x.n,x.t,mem);c.id=x.id;c.sy=1;C.unshift(c)}else{c.n=x.t==='خصوصی'?(mem[0]||c.n):x.n;c.mem=mem}c.mid=mid;c.ti=x.ti||[]});
  C=C.filter(c=>!(c.sy&&c.id&&kd(c))||ids.has(c.id));ch=1}
 for(const c of C)if(!c.sy&&kd(c)&&ses.r==='cmd'){await rpc('make_chat',{id:c.id,n:c.n,t:c.t});c.sy=1;tc=0}
 for(const c of C)if(srv(c))for(const m of c.m)if(m.sy===0&&!m.q){const b={k:m.k,x:m.x,r:m.r,fw:m.fw,o:m.o&&m.o.map(z=>({t:z.t})),ex:m.ex,sl:m.sl,fn:m.fn,sz:m.sz,d:m.d};
  if(JSON.stringify(b).length>18000){m.sy=-1;toast('فایل بزرگ بعد از اتصال Storage ارسال می‌شود');if(C[cur]===c)rep(m);continue}
  try{await rpc('send',{id:String(m.i),chat:c.id,body:b});m.sy=1;m.st=2;ch=1}catch(e){if(isPerm(e)){m.sy=-2;toast('ارسال نشد: '+e.message)}else throw e}
  if(C[cur]===c)rep(m)}
 for(const c of C)if(srv(c)&&c.ox&&c.ox.length){const keep=[];
  for(let j=0;j<c.ox.length;j++){const ev=c.ox[j],m=c.m.find(x=>String(x.i)===ev.m);if(!m||m.sy<0)continue;if(m.sy===0){keep.push(ev);continue}
   try{await rpc('emit',{eid:ev.id,cid:c.id,mid:ev.m,kd:ev.k,dt:ev.d})}catch(e){if(!isPerm(e)){c.ox=keep.concat(c.ox.slice(j));throw e}}}
  c.ox=keep;ch=1}
 const R=await rpc('pull_all',{after:LAST});let miss=0,mx=LAST;
 for(const x of R){const c=C.find(c=>c.id===x.c);if(!c){miss=1;continue}mx=Math.max(mx,x.t);
  if(c.m.some(m=>String(m.i)===x.id))continue;
  const b=cleanBody(x.b);if(b.ex&&b.ex<now())continue;
  const m=Object.assign({},b,{i:x.id,w:x.s===ses.id?'me':'him',nm:x.n,tm:hmt(x.t),ts:x.t,st:3});
  c.m.push(m);ch=1;
  if(cur!==null&&C[cur]===c&&$('#room').classList.contains('on')){draw(m,1);scr()}
  else if(m.w==='him'){c.un=(c.un||0)+1;if(!c.mu&&!m.sl){tone();vb(m.k==='s'?[60,40,60]:10)}}}
 if(miss)tc=0;else if(mx!==LAST){LAST=mx;lsv2()}
 const E=await rpc('pull_events',{after:LASTE});let me2=LASTE;
 for(const e of E){me2=Math.max(me2,e.t);if(EVS.has(e.id))continue;EVS.add(e.id);const c=C.find(c=>c.id===e.c);if(c){applyEv(c,e);ch=1}}
 if(EVS.size>3000)EVS.clear();if(me2!==LASTE){LASTE=me2;lsv2()}
 if(cc){const k=C.indexOf(cc);if(k<0){cur=null;close('room')}else cur=k}
 for(const c of C)if(c.sy&&kd(c)){const lim=(c.t==='خصوصی'?2:7)*864e5,n0=c.m.length;c.m=c.m.filter(m=>!m.ts||m.k==='a'||Date.now()-m.ts<lim);if(c.m.length!==n0)ch=1}
 if(ch){sv();if($('#msgr').classList.contains('on'))renderList()}}
async function tick(){if(CFG.url&&ready&&ses&&role){try{await syncAll();sok=1;fl=0}catch(e){sok=0;fl++}bn()}setTimeout(tick,Math.min(3e3*2**Math.min(fl,4),3e4))}tick();
/* ===== v8: ظاهر تلگرامی ===== */
const NC=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae','#d4a017'];
function nc(n){let h=0;for(const ch of String(n||''))h=(h*31+ch.charCodeAt(0))>>>0;return NC[h%NC.length]}
const dk=t=>{const d=new Date(t);return d.getFullYear()*400+d.getMonth()*32+d.getDate()};
const dlab=t=>{const k=dk(t),n=Date.now();if(k===dk(n))return 'امروز';if(k===dk(n-864e5))return 'دیروز';return new Intl.DateTimeFormat('fa-IR',{month:'long',day:'numeric'}).format(t)};
let decoQ=0;
function deco(){decoQ=0;if(cur===null||!C[cur])return;const ms=$('#msgs'),c=C[cur];obs.disconnect();
 try{ms.querySelectorAll('.ds,.av2').forEach(x=>x.remove());
 const els=[...ms.querySelectorAll(':scope>.m')],grp=c.t==='گروه';ms.dataset.g=grp?'1':'';
 let pm=null,pe=null;
 els.forEach(el=>{const m=fm(el.dataset.i);el.classList.remove('f','tl');if(!m){pm=null;pe=null;return}
  const nw=!pm||pm.w!==m.w||(pm.nm||'')!==(m.nm||'')||!!m.ts!==!!pm.ts||(m.ts&&(dk(m.ts)!==dk(pm.ts)||m.ts-pm.ts>3e5))||pm.k==='s'||m.k==='s'||pm.k==='a'||m.k==='a';
  if(m.ts&&(!pm||!pm.ts||dk(pm.ts)!==dk(m.ts))){const d=document.createElement('div');d.className='ds';d.textContent=dlab(m.ts);el.before(d)}
  if(nw){el.classList.add('f');if(pe)pe.classList.add('tl')}
  pm=m;pe=el});
 if(pe)pe.classList.add('tl');
 if(grp)ms.querySelectorAll('.m.him.tl').forEach(el=>{const m=fm(el.dataset.i);if(!m)return;const a=document.createElement('span');a.className='av2';a.textContent=(m.nm||'?')[0];a.style.background=nc(m.nm);el.appendChild(a)})}
 catch(e){}
 obs.observe(ms,{childList:true})}
const obs=new MutationObserver(()=>{if(!decoQ){decoQ=1;queueMicrotask(deco)}});
obs.observe($('#msgs'),{childList:true});

if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{const up=()=>{try{r.update()}catch(e){}};up();setInterval(up,1800000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)up()})}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had){const u=document.getElementById('upd');if(u)u.hidden=false}});const ub=document.getElementById('updb');if(ub)ub.onclick=()=>location.reload()}
})();
